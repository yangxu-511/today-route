name: Cross-platform verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and launcher
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify Mac launcher
        shell: bash
        run: |
          zsh -n './启动今日航线-Mac.command'
          './启动今日航线-Mac.command' > /tmp/today-route-mac.log 2>&1 &
          launcher_pid=$!
          trap 'kill "$launcher_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ | grep -q '<title>今日航线</title>'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/today-route-mac.log
          exit 1

  windows:
    name: Windows build and launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify Windows launcher
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "启动今日航线-Windows.cmd" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\today-route-windows.log" -RedirectStandardError "$env:RUNNER_TEMP\today-route-windows-error.log"
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:4173/" -UseBasicParsing
                if ($response.StatusCode -eq 200 -and $response.Content.Contains("<title>今日航线</title>")) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Get-Content "$env:RUNNER_TEMP\today-route-windows.log" -ErrorAction SilentlyContinue
              Get-Content "$env:RUNNER_TEMP\today-route-windows-error.log" -ErrorAction SilentlyContinue
              throw "Windows launcher did not serve 今日航线 within 30 seconds."
            }
          } finally {
            taskkill /PID $process.Id /T /F 2>$null
          }
